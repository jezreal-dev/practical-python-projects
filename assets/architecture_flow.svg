<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="260">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388bfd" />
      <stop offset="100%" stop-color="#58a6ff" />
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ea043" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8957e5" />
      <stop offset="100%" stop-color="#a371f7" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #f0f6fc; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 400; font-size: 11px; fill: #8b949e; }
    .tag-text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 10px; font-weight: 500; }
    .flow-line { stroke: #30363d; stroke-width: 2; stroke-dasharray: 6 4; }
    .card-border { stroke: #30363d; stroke-width: 1.5; rx: 8; ry: 8; }
    
    @keyframes pulseCard {
      0% { stroke: #30363d; }
      50% { stroke: #58a6ff; }
      100% { stroke: #30363d; }
    }
    .pulsing-box { animation: pulseCard 4s ease-in-out infinite; }
  </style>

  <!-- Background Canvas -->
  <rect width="880" height="260" rx="12" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1" />

  <!-- Flow Paths -->
  <line x1="190" y1="130" x2="250" y2="130" class="flow-line" />
  <line x1="410" y1="130" x2="470" y2="130" class="flow-line" />
  <line x1="630" y1="130" x2="690" y2="130" class="flow-line" />

  <!-- Animated Data Packets (Motion Graphics) -->
  <circle r="4" fill="#58a6ff" filter="url(#glowEffect)" cy="130">
    <animate attributeName="cx" from="190" to="250" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="2s" repeatCount="indefinite" />
  </circle>

  <circle r="4" fill="#3fb950" filter="url(#glowEffect)" cy="130">
    <animate attributeName="cx" from="410" to="470" dur="2s" begin="0.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="2s" begin="0.5s" repeatCount="indefinite" />
  </circle>

  <circle r="4" fill="#a371f7" filter="url(#glowEffect)" cy="130">
    <animate attributeName="cx" from="630" to="690" dur="2s" begin="1s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="2s" begin="1s" repeatCount="indefinite" />
  </circle>

  <!-- Node 1: User Input -->
  <g transform="translate(30, 60)">
    <rect width="160" height="140" fill="#161b22" class="card-border" />
    <rect width="160" height="28" rx="8" fill="#21262d" />
    <circle cx="15" cy="14" r="4" fill="#f85149" />
    <circle cx="27" cy="14" r="4" fill="#d29922" />
    <circle cx="39" cy="14" r="4" fill="#3fb950" />
    <text x="54" y="18" class="tag-text" fill="#8b949e">terminal</text>
    <text x="16" y="55" class="title-text">1. User Interaction</text>
    <text x="16" y="75" class="sub-text">• Raw CLI inputs</text>
    <text x="16" y="93" class="sub-text">• Category selection</text>
    <text x="16" y="111" class="sub-text">• Menu choices</text>
    <rect x="16" y="122" width="70" height="14" rx="3" fill="#388bfd" fill-opacity="0.15" />
    <text x="22" y="132" class="tag-text" fill="#58a6ff">STDIN / OUT</text>
  </g>

  <!-- Node 2: Presentation Layer -->
  <g transform="translate(250, 60)">
    <rect width="160" height="140" fill="#161b22" class="card-border pulsing-box" />
    <rect width="160" height="28" rx="8" fill="#21262d" />
    <text x="16" y="18" class="tag-text" fill="#58a6ff">main.py</text>
    <text x="16" y="55" class="title-text">2. Presentation</text>
    <text x="16" y="75" class="sub-text">• ANSI screen clear</text>
    <text x="16" y="93" class="sub-text">• Input string parsing</text>
    <text x="16" y="111" class="sub-text">• Success/error banners</text>
    <rect x="16" y="122" width="85" height="14" rx="3" fill="#58a6ff" fill-opacity="0.15" />
    <text x="22" y="132" class="tag-text" fill="#58a6ff">CLI BOUNDARY</text>
  </g>

  <!-- Node 3: Core Domain Logic -->
  <g transform="translate(470, 60)">
    <rect width="160" height="140" fill="#161b22" class="card-border" />
    <rect width="160" height="28" rx="8" fill="#21262d" />
    <text x="16" y="18" class="tag-text" fill="#3fb950">utils.py</text>
    <text x="16" y="55" class="title-text">3. Core Domain</text>
    <text x="16" y="75" class="sub-text">• Decimal math (&gt; 0)</text>
    <text x="16" y="93" class="sub-text">• Monotonic ID gen</text>
    <text x="16" y="111" class="sub-text">• Domain exceptions</text>
    <rect x="16" y="122" width="75" height="14" rx="3" fill="#2ea043" fill-opacity="0.15" />
    <text x="22" y="132" class="tag-text" fill="#3fb950">PURE LOGIC</text>
  </g>

  <!-- Node 4: Storage Engine -->
  <g transform="translate(690, 60)">
    <rect width="160" height="140" fill="#161b22" class="card-border" />
    <rect width="160" height="28" rx="8" fill="#21262d" />
    <text x="16" y="18" class="tag-text" fill="#a371f7">JSON Storage</text>
    <text x="16" y="55" class="title-text">4. Persistence</text>
    <text x="16" y="75" class="sub-text">• ISO date conversion</text>
    <text x="16" y="93" class="sub-text">• Type rehydration</text>
    <text x="16" y="111" class="sub-text">• Fault-tolerant load</text>
    <rect x="16" y="122" width="75" height="14" rx="3" fill="#8957e5" fill-opacity="0.15" />
    <text x="22" y="132" class="tag-text" fill="#a371f7">FILE SYSTEM</text>
  </g>

  <!-- Footer Tag -->
  <text x="30" y="235" class="sub-text" fill="#8b949e">Flow: User Input -> CLI Parsing -> Pure Domain Validation -> Serialized Storage (expenses_log.json)</text>
</svg>
